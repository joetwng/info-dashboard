<!DOCTYPE html>
<html lang="zh-HK">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kitchen Order</title>
    <link rel="stylesheet" href="receipts.css?v=202609211449" />
  </head>
  <body>
    <main class="receipts-page">
      <header class="page-header">
        <div class="title-row">
          <h1>Kitchen Order</h1>
          <div class="search-row">
            <label class="search-label" for="receipt-search">搜尋檔案名稱</label>
            <input
              id="receipt-search"
              class="search-input"
              type="search"
              placeholder="例如：2748"
              autocomplete="off"
            />
            <div class="heading-actions">
              <button type="button" id="extract-btn" class="extract-btn">Extract</button>
              <button type="button" id="view-toggle" class="view-toggle">Show Printed</button>
              <button type="button" id="fs-toggle" class="fs-toggle">Full screen</button>
            </div>
          </div>
        </div>
</header>

      <section class="receipt-section" aria-label="收據">
        <div class="receipt-scroll">
        <div id="receipt-list" class="receipt-list" aria-live="polite"></div>
        </div>
        <p id="empty-state" class="empty-state" hidden>找不到符合的收據。</p>
      </section>
</main>

    <script>
      const STORAGE_KEY = "star-receipts-prt-names";
      const VIEW_KEY = "star-receipts-view-mode";
      const fallbackManifest = [];
      const searchInput = document.getElementById("receipt-search");
      const receiptList = document.getElementById("receipt-list");
      const emptyState = document.getElementById("empty-state");
      const viewToggle = document.getElementById("view-toggle");

      const fsToggle = document.getElementById("fs-toggle");

      function isFullScreen() {
        return !!(document.fullscreenElement || document.webkitFullscreenElement);
      }

      function updateFsLabel() {
        fsToggle.textContent = isFullScreen() ? "Resume" : "Full screen";
      }

      async function toggleFullScreen() {
        try {
          if (!isFullScreen()) {
            const el = document.documentElement;
            if (el.requestFullscreen) await el.requestFullscreen();
            else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
          } else {
            if (document.exitFullscreen) await document.exitFullscreen();
            else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
          }
        } catch (e) {
          console.warn("Fullscreen failed", e);
        }
        updateFsLabel();
      }

      fsToggle.addEventListener("click", toggleFullScreen);
      document.addEventListener("fullscreenchange", updateFsLabel);
      document.addEventListener("webkitfullscreenchange", updateFsLabel);
      updateFsLabel();



      const EXTRACT_CFG_KEY = "star-receipts-extract-webhook";
      const extractBtn = document.getElementById("extract-btn");

      function loadExtractCfg() {
        try {
          const raw = localStorage.getItem(EXTRACT_CFG_KEY);
          const cfg = raw ? JSON.parse(raw) : null;
          if (cfg && cfg.url) return cfg;
        } catch (e) {}
        return null;
      }

      function saveExtractCfg(cfg) {
        localStorage.setItem(EXTRACT_CFG_KEY, JSON.stringify(cfg));
      }

      function promptExtractCfg() {
        const current = loadExtractCfg() || {};
        const url = window.prompt(
          "Paste STAR「Execute once」webhook URL（喺 STAR TSP 143IV emulator → Routines 複製；只存呢部瀏覽器）",
          current.url || ""
        );
        if (!url) return null;
        const key = window.prompt(
          "Paste sender key（如有；可留空）。同樣只存本機，唔會寫入公開網頁。",
          current.key || ""
        );
        const cfg = { url: url.trim(), key: (key || "").trim() };
        if (!cfg.url) return null;
        saveExtractCfg(cfg);
        return cfg;
      }

      async function runExtract(forceConfig) {
        let cfg = forceConfig ? null : loadExtractCfg();
        if (!cfg) cfg = promptExtractCfg();
        if (!cfg) return;

        const prev = extractBtn.textContent;
        extractBtn.disabled = true;
        extractBtn.textContent = "Extracting…";
        try {
          const headers = { "Content-Type": "application/json" };
          if (cfg.key) {
            headers["Authorization"] = "Bearer " + cfg.key;
            headers["X-Webhook-Key"] = cfg.key;
          }
          const res = await fetch(cfg.url, {
            method: "POST",
            headers: headers,
            body: JSON.stringify({
              action: "drain",
              mac: "00:11:62:42:79:1c",
              source: "kitchen-order-extract-button",
            }),
            mode: "cors",
          });
          if (!res.ok) throw new Error("HTTP " + res.status);
          extractBtn.textContent = "Sent ✓";
          window.setTimeout(function () {
            extractBtn.textContent = prev;
            extractBtn.disabled = false;
          }, 2500);
        } catch (e) {
          console.warn("Extract failed", e);
          extractBtn.textContent = "Failed";
          window.alert(
            "Extract 送唔出（可能係 CORS／URL／key）。\n可 Shift+撳 Extract 重新貼 webhook。\n錯誤：" +
              (e && e.message ? e.message : e)
          );
          window.setTimeout(function () {
            extractBtn.textContent = prev;
            extractBtn.disabled = false;
          }, 2000);
        }
      }

      if (extractBtn) {
        extractBtn.addEventListener("click", function (event) {
          runExtract(!!event.shiftKey);
        });
      }

      const receiptScroll = document.querySelector(".receipt-scroll");
      let scrollIdleTimer = null;
      const SCROLL_IDLE_MS = 2000;

      function scrollReceiptsToTop() {
        if (!receiptScroll) return;
        receiptScroll.scrollTo({ top: 0, behavior: "smooth" });
      }

      function armScrollIdleReturn() {
        if (!receiptScroll) return;
        if (scrollIdleTimer) clearTimeout(scrollIdleTimer);
        scrollIdleTimer = setTimeout(function () {
          if (receiptScroll.scrollTop > 0) {
            scrollReceiptsToTop();
          }
        }, SCROLL_IDLE_MS);
      }

      if (receiptScroll) {
        receiptScroll.addEventListener("scroll", armScrollIdleReturn, { passive: true });
        receiptScroll.addEventListener("wheel", armScrollIdleReturn, { passive: true });
        receiptScroll.addEventListener("touchmove", armScrollIdleReturn, { passive: true });
      }



      let receipts = [];
      let viewMode = localStorage.getItem(VIEW_KEY) === "printed" ? "printed" : "unprinted";

      function loadPrintedNames() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          const arr = raw ? JSON.parse(raw) : [];
          return new Set(Array.isArray(arr) ? arr : []);
        } catch (e) {
          return new Set();
        }
      }

      function savePrintedNames(set) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(Array.from(set)));
      }

      function baseName(name) {
        if (!name) return "";
        return name.startsWith("PRT_") ? name.slice(4) : name;
      }

      function isPrinted(name, printedSet) {
        if (!name) return false;
        const base = baseName(name);
        if (name.startsWith("PRT_")) {
          // File already has PRT_ unless explicitly unmarked
          return !printedSet.has("UNPRT_" + base);
        }
        return printedSet.has(base) || printedSet.has("PRT_" + base);
      }

      function togglePrinted(name) {
        if (!name) return;
        const set = loadPrintedNames();
        const base = baseName(name);
        if (isPrinted(name, set)) {
          // Remove PRT_: clear printed marks; if real filename has PRT_, mark UNPRT_ override
          set.delete(base);
          set.delete("PRT_" + base);
          if (name.startsWith("PRT_")) {
            set.add("UNPRT_" + base);
          }
        } else {
          // Add PRT_
          set.delete("UNPRT_" + base);
          set.add(base);
          set.add("PRT_" + base);
        }
        savePrintedNames(set);
      }

      function updateToggleLabel() {
        viewToggle.textContent = viewMode === "unprinted" ? "Show Printed" : "Show Un-Print";
      }

      function visibleReceipts(printedSet) {
        const query = searchInput.value.trim().toLocaleLowerCase();
        const wantPrinted = viewMode === "printed";
        return receipts
          .filter((receipt) => isPrinted(receipt.name, printedSet) === wantPrinted)
          .filter((receipt) => {
            const name = (receipt.name || "").toLocaleLowerCase();
            const title = (receipt.title || "").toLocaleLowerCase();
            const base = baseName(receipt.name || "").toLocaleLowerCase();
            return name.includes(query) || title.includes(query) || base.includes(query);
          })
          .slice()
          .sort(function (a, b) {
            const ac = a.createdAt || "";
            const bc = b.createdAt || "";
            if (wantPrinted) {
              if (ac < bc) return 1;
              if (ac > bc) return -1;
            } else {
              if (ac < bc) return -1;
              if (ac > bc) return 1;
            }
            return (a.name || "").localeCompare(b.name || "");
          });
      }

      function renderReceipts() {
        const printedSet = loadPrintedNames();
        const matches = visibleReceipts(printedSet);
        updateToggleLabel();

        receiptList.replaceChildren();
        emptyState.hidden = matches.length !== 0;

        matches.forEach((receipt) => {
          const card = document.createElement("div");
          card.className = "receipt-card";
          const printed = isPrinted(receipt.name, printedSet);
          card.title = (receipt.name || "") + (printed ? "（雙擊移除 PRT_）" : "（雙擊加上 PRT_）");
          card.dataset.name = receipt.name || "";

          if (receipt.preview) {
            const img = document.createElement("img");
            img.className = "pdf-preview";
            img.src = receipt.preview + "?v=202609211449";
            img.alt = receipt.title || receipt.name || "Receipt preview";
            img.loading = "lazy";
            img.draggable = false;
            card.appendChild(img);
          } else {
            const fallback = document.createElement("div");
            fallback.className = "pdf-fallback";
            fallback.textContent = receipt.name || "PDF";
            card.appendChild(fallback);
          }

          card.addEventListener("dblclick", function (event) {
            event.preventDefault();
            event.stopPropagation();
            togglePrinted(receipt.name);
            renderReceipts();
          });

          receiptList.appendChild(card);
        });
      }

      viewToggle.addEventListener("click", function () {
        viewMode = viewMode === "unprinted" ? "printed" : "unprinted";
        localStorage.setItem(VIEW_KEY, viewMode);
        renderReceipts();
      });

      searchInput.addEventListener("input", renderReceipts);

      fetch("manifest.json?v=202609211449")
        .then((response) => {
          if (!response.ok) throw new Error("Manifest request failed: " + response.status);
          return response.json();
        })
        .catch(() => fallbackManifest)
        .then((manifest) => {
          receipts = Array.isArray(manifest) ? manifest : fallbackManifest;
          renderReceipts();
        });
    </script>
  </body>
</html>
